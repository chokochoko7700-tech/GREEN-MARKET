<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta name="theme-color" content="#ffffff" />
  <title>Green Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="/app.css?v=__VERSION__" />
  <script>window.APP_VERSION = '__VERSION__';</script>
</head>
<body>
  <div id="splash" class="splash">
    <div>
      <div class="logo"><iconify-icon icon="lucide:shopping-bag"></iconify-icon></div>
      <div class="name">Green Market</div>
    </div>
  </div>

  <main id="view" class="view"></main>

  <nav id="fnav" class="fnav" hidden>
    <div class="bar">
      <button data-tab="home"><iconify-icon icon="lucide:house"></iconify-icon><span data-i="t_home"></span></button>
      <button data-tab="catalog"><iconify-icon icon="lucide:layout-grid"></iconify-icon><span data-i="t_catalog"></span></button>
      <button data-tab="stores"><iconify-icon icon="lucide:map-pin"></iconify-icon><span data-i="t_stores"></span></button>
      <button data-tab="profile"><iconify-icon icon="lucide:user-round"></iconify-icon><span data-i="t_profile"></span></button>
    </div>
    <button class="cartbtn press" id="cartBtn" data-tab="cart"><iconify-icon icon="lucide:shopping-bag"></iconify-icon><b id="cartBadge" class="badge" hidden></b></button>
  </nav>

  <div id="sheetWrap" class="sheet-wrap" hidden>
    <div class="sheet-backdrop"></div>
    <div class="sheet"><div class="sheet-grip"></div><div id="sheetBody"></div></div>
  </div>
  <div id="toast" class="toast"></div>

  <script src="/app.js?v=__VERSION__"></script>
</body>
</html>
